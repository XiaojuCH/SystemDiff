name: CI

on:
  push:
    branches:
      - main
      # Narrow pre-merge candidate validation for Issue #9.
      - build/portable-developer-preview
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Select stable Rust
        run: rustup default stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-targets

      - name: Exercise CLI fixture reports
        run: |
          cargo run --locked -p systemdiff-cli -- diff fixtures/snapshots/before-v1.json fixtures/snapshots/after-v1.json
          cargo run --locked -p systemdiff-cli -- diff --json fixtures/snapshots/before-v1.json fixtures/snapshots/after-v1.json

      - name: List Collector status
        run: cargo run --locked -p systemdiff-cli -- collectors

  package-windows-preview:
    name: Package Windows developer preview
    if: github.event_name == 'push'
    needs: rust
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Select stable Rust
        run: rustup default stable

      - name: Install Windows x64 Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build portable package
        shell: pwsh
        env:
          SYSTEMDIFF_COMMIT_SHA: ${{ github.sha }}
          SYSTEMDIFF_ARTIFACT_DIR: ${{ runner.temp }}\systemdiff-preview-artifact
        run: >-
          ./scripts/package-windows-preview.ps1
          -RepositoryRoot $env:GITHUB_WORKSPACE
          -OutputDirectory $env:SYSTEMDIFF_ARTIFACT_DIR
          -CommitSha $env:SYSTEMDIFF_COMMIT_SHA

      - name: Verify package before upload
        shell: pwsh
        env:
          SYSTEMDIFF_ARTIFACT_DIR: ${{ runner.temp }}\systemdiff-preview-artifact
        run: >-
          ./scripts/verify-windows-preview.ps1
          -ArtifactDirectory $env:SYSTEMDIFF_ARTIFACT_DIR
          -RepositoryRoot $env:GITHUB_WORKSPACE
          -ExpectedCommitSha $env:GITHUB_SHA
          -RemoveToolchainFromPath

      - name: Upload portable preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.ref_name == 'main' && 'systemdiff-windows-x86_64-developer-preview' || 'systemdiff-windows-x86_64-developer-preview-candidate' }}
          path: |
            ${{ runner.temp }}\systemdiff-preview-artifact\systemdiff-windows-x86_64.zip
            ${{ runner.temp }}\systemdiff-preview-artifact\SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          overwrite: false
          retention-days: 14

  verify-windows-preview:
    name: Verify downloaded Windows developer preview
    if: github.event_name == 'push'
    needs: package-windows-preview
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download portable preview
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.ref_name == 'main' && 'systemdiff-windows-x86_64-developer-preview' || 'systemdiff-windows-x86_64-developer-preview-candidate' }}
          path: ${{ runner.temp }}\downloaded-systemdiff-preview

      - name: Verify downloaded artifact without Cargo
        shell: pwsh
        env:
          SYSTEMDIFF_DOWNLOADED_ARTIFACT: ${{ runner.temp }}\downloaded-systemdiff-preview
        run: >-
          ./scripts/verify-windows-preview.ps1
          -ArtifactDirectory $env:SYSTEMDIFF_DOWNLOADED_ARTIFACT
          -RepositoryRoot $env:GITHUB_WORKSPACE
          -ExpectedCommitSha $env:GITHUB_SHA
          -RemoveToolchainFromPath
