name: Bug report
description: Report reproducible incorrect behavior or a regression
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SystemDiff. **Do not attach an unreviewed real snapshot or log.** Reports may contain usernames, paths, software, host data, task XML, or secrets. Prefer synthetic data or a manually sanitized excerpt.

  - type: input
    id: version
    attributes:
      label: SystemDiff version
      description: Release version or commit SHA. State "bootstrap" if no release is involved.
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Include edition, build, architecture, and Server/Core when relevant.
      placeholder: Windows 11 24H2 build 26100, x64
    validations:
      required: true

  - type: dropdown
    id: privilege
    attributes:
      label: Privilege state
      options:
        - Standard user
        - Elevated administrator
        - SYSTEM or service context
        - Unknown
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic sequence and inputs.
      placeholder: |
        1. Run ...
        2. Compare ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include exact stable error/Collector/rule IDs when available.
    validations:
      required: true

  - type: textarea
    id: sanitized_evidence
    attributes:
      label: Sanitized evidence
      description: Optional synthetic fixture or manually reviewed excerpt. Explain how it was sanitized.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the content above and did not include credentials, secrets, personal data, or an unreviewed real report.
          required: true
