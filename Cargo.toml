[workspace]
members = [
    "crates/systemdiff-cli",
    "crates/systemdiff-core",
    "crates/systemdiff-diff",
    "crates/systemdiff-report",
    "crates/systemdiff-risk",
    "crates/systemdiff-windows",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["SystemDiff contributors"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
systemdiff-core = { path = "crates/systemdiff-core" }
systemdiff-diff = { path = "crates/systemdiff-diff" }
systemdiff-report = { path = "crates/systemdiff-report" }
systemdiff-windows = { path = "crates/systemdiff-windows" }
