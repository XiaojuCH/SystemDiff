[package]
name = "systemdiff-desktop"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["SystemDiff contributors"]
publish = false
build = "build.rs"

[lib]
name = "systemdiff_desktop"
path = "src/lib.rs"

[[bin]]
name = "systemdiff-desktop"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
systemdiff-core = { path = "../../../crates/systemdiff-core" }
systemdiff-diff = { path = "../../../crates/systemdiff-diff" }
systemdiff-report = { path = "../../../crates/systemdiff-report" }
systemdiff-windows = { path = "../../../crates/systemdiff-windows" }
time = { version = "0.3.55", default-features = false, features = ["formatting", "std"] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.11.5", default-features = false, features = ["wry"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# Keep the desktop dependency graph and lockfile independent from the portable
# CLI workspace until a desktop artifact is part of the release process.
[workspace]
